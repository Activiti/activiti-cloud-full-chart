runtime-bundle:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    ACTIVITI_CLOUD_MESSAGING_FUNCTION_ROUTER_ENABLED: 'true'
    ACTIVITI_CLOUD_RUNTIME_BUNDLE_MESSAGING_REQUIRED_AUDIT_PRODUCER_GROUPS: consumer
activiti-cloud-query:
  liquibase:
    enabled: false
  args:
    - -jar
    - rest.jar
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
activiti-cloud-consumer:
  enabled: true
  env:
    ACTIVITI_CLOUD_MESSAGING_FUNCTION_ROUTER_ENABLED: 'true'
